name: Publish
on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Publish to npm
        run: |
          # Use workspaces to publish all non-private packages at once
          # --if-present is not a standard flag for publish, so we use a simple loop
          # to check if the version already exists before trying to publish
          for dir in packages/*; do
            if [ -d "$dir" ] && [ -f "$dir/package.json" ]; then
              NAME=$(node -p "require('./$dir/package.json').name")
              VERSION=$(node -p "require('./$dir/package.json').version")
              PRIVATE=$(node -p "require('./$dir/package.json').private || false")
              
              if [ "$PRIVATE" = "false" ]; then
                if ! npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
                  echo "Publishing $NAME@$VERSION..."
                  cd "$dir" && npm publish --access public --provenance
                  cd ../..
                else
                  echo "$NAME@$VERSION already exists on npm, skipping."
                fi
              fi
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
